[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ebics_bank_connector"
authors = [{name = "h4ppii"}]
description = "EBICS banking automation for ERPNext 16"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dynamic = ["version"]
# NOTE: The EBICS backend library (fintech, ebicsclient, ebicsPy, ...) is NOT
# declared as a dependency here, because every available pure-Python EBICS
# library is either proprietary or copyleft-restricted. Install the backend of
# your choice manually, e.g.:
#   bench --site site1.local pip install fintech lxml
# The app installs and runs without an EBICS backend (stub backend for tests);
# a real backend is only needed for live bank communication.
dependencies = [
    # CAMT.053 / ISO 20022 XML parsing
    "lxml>=4.9",
]

[project.urls]
Homepage = "https://github.com/SLAYh4ppii/ebics_bank_connector"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
erpnext = ">=16.0.0"

[tool.bench.app]
app_name = "ebics_bank_connector"
app_title = "EBICS Bank Connector"
app_publisher = "h4ppii"
app_description = "EBICS banking automation for ERPNext 16"
app_email = ""
app_license = "GPL-3.0-or-later"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ebics_bank_connector"
authors = [{name = "h4ppii"}]
description = "EBICS banking automation for ERPNext 16"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dynamic = ["version"]
# The EBICS backend library. "fintech" is the only mature pure-Python EBICS
# library on PyPI that supports EBICS 2.4/2.5/3.0. Note: fintech has its own
# proprietary license (free for non-commercial use, paid for commercial use).
# This app's GPL-3.0 license does not affect the fintech library's license.
# See https://www.joonis.de/en/fintech/license/ for fintech licensing details.
dependencies = [
    # EBICS protocol backend (default, swappable via connection.py)
    "fintech>=7.0",
    # CAMT.053 / ISO 20022 XML parsing
    "lxml>=4.9",
]

[project.urls]
Homepage = "https://github.com/SLAYh4ppii/ebics_bank_connector"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
erpnext = ">=16.0.0"

[tool.bench.app]
app_name = "ebics_bank_connector"
app_title = "EBICS Bank Connector"
app_publisher = "h4ppii"
app_description = "EBICS banking automation for ERPNext 16"
app_email = ""
app_license = "GPL-3.0-or-later"
